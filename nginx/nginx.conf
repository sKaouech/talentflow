# ===================================
# Configuration Nginx Production
# TalentFlow - Reverse Proxy & Load Balancer
# ===================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Optimisations de performance
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ===================================
    # Configuration de base
    # ===================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ===================================
    # Optimisations de performance
    # ===================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffers
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 30s;

    # ===================================
    # Compression
    # ===================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ===================================
    # Sécurité
    # ===================================
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # ===================================
    # Upstream Servers
    # ===================================
    upstream web_backend {
        least_conn;
        server web-prod:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream api_backend {
        least_conn;
        server api-prod:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===================================
    # Cache Configuration
    # ===================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d max_size=1g;
    proxy_temp_path /var/cache/nginx/temp;

    # ===================================
    # Server Blocks
    # ===================================

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name talentflow.seyka.fr www.talentflow.seyka.fr;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Redirection HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # Configuration HTTPS principale
    server {
        listen 443 ssl http2;
        server_name talentflow.seyka.fr www.talentflow.seyka.fr;

        # ===================================
        # SSL Configuration
        # ===================================
        ssl_certificate /etc/nginx/ssl/talentflow.seyka.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/talentflow.seyka.fr.key;
        
        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ===================================
        # Proxy Settings
        # ===================================
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # ===================================
        # API Routes
        # ===================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit_per_ip 10;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # CORS pour API
            add_header Access-Control-Allow-Origin "https://talentflow.seyka.fr" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            
            # Préflight CORS
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://talentflow.seyka.fr";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }

        # ===================================
        # Static Files & Assets
        # ===================================
        location /_next/static/ {
            proxy_pass http://web_backend;
            proxy_cache STATIC;
            proxy_cache_valid 200 1y;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /static/ {
            proxy_pass http://web_backend;
            proxy_cache STATIC;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Images et médias
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            proxy_pass http://web_backend;
            proxy_cache STATIC;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public";
            expires 7d;
        }

        # Fonts
        location ~* \.(woff|woff2|ttf|eot)$ {
            proxy_pass http://web_backend;
            proxy_cache STATIC;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            expires 1y;
        }

        # CSS et JS
        location ~* \.(css|js)$ {
            proxy_pass http://web_backend;
            proxy_cache STATIC;
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public";
            expires 1d;
        }

        # ===================================
        # Application Web
        # ===================================
        location / {
            limit_req zone=web burst=10 nodelay;
            limit_conn conn_limit_per_ip 5;
            
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Cache pour les pages
            proxy_cache STATIC;
            proxy_cache_valid 200 5m;
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache $http_pragma $http_authorization;
            
            # Headers de cache
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ===================================
        # Health Check
        # ===================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ===================================
        # Security & Robots
        # ===================================
        location /robots.txt {
            proxy_pass http://web_backend;
            add_header Cache-Control "public";
            expires 1d;
        }

        location /sitemap.xml {
            proxy_pass http://web_backend;
            add_header Cache-Control "public";
            expires 1d;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(env|log|git)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ===================================
    # Monitoring Subdomain
    # ===================================
    server {
        listen 443 ssl http2;
        server_name monitoring.talentflow.com;
        
        ssl_certificate /etc/nginx/ssl/monitoring.talentflow.com.crt;
        ssl_certificate_key /etc/nginx/ssl/monitoring.talentflow.com.key;
        
        # Authentification basique pour Grafana
        auth_basic "Monitoring Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        location / {
            proxy_pass http://grafana-prod:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ===================================
    # Files Subdomain (MinIO)
    # ===================================
    server {
        listen 443 ssl http2;
        server_name files.talentflow.com;
        
        ssl_certificate /etc/nginx/ssl/files.talentflow.com.crt;
        ssl_certificate_key /etc/nginx/ssl/files.talentflow.com.key;
        
        client_max_body_size 100m;
        
        location / {
            proxy_pass http://minio-prod:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS pour uploads
            add_header Access-Control-Allow-Origin "https://talentflow.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        }
    }
}
