# ===================================
# Configuration Nginx - Développement
# Domain: talentflow-dev.seyka.fr
# ===================================

# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name talentflow-dev.seyka.fr;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy dev\n";
        add_header Content-Type text/plain;
    }
    
    # Redirection HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuration HTTPS Développement
server {
    listen 443 ssl http2;
    server_name talentflow-dev.seyka.fr;

    # ===================================
    # SSL Configuration
    # ===================================
    ssl_certificate /etc/nginx/ssl/talentflow-dev.seyka.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/talentflow-dev.seyka.fr.key;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ===================================
    # Security Headers
    # ===================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: https:; font-src 'self' data: https:;" always;

    # ===================================
    # Proxy Settings
    # ===================================
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ===================================
    # API Routes
    # ===================================
    location /api/ {
        # Rate limiting pour DEV (plus permissif)
        limit_req zone=api burst=50 nodelay;
        limit_conn conn_limit_per_ip 20;
        
        proxy_pass http://api-dev:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # CORS pour API DEV
        add_header Access-Control-Allow-Origin "https://talentflow-dev.seyka.fr" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        
        # Préflight CORS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://talentflow-dev.seyka.fr";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # ===================================
    # Static Files & Assets
    # ===================================
    location /_next/static/ {
        proxy_pass http://web-dev:3000;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /static/ {
        proxy_pass http://web-dev:3000;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public";
    }

    # Images et médias
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        proxy_pass http://web-dev:3000;
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public";
        expires 1h;
    }

    # ===================================
    # Application Web
    # ===================================
    location / {
        # Rate limiting pour DEV (plus permissif)
        limit_req zone=web burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;
        
        proxy_pass http://web-dev:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Headers de développement
        add_header X-Environment "development" always;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ===================================
    # Development Tools
    # ===================================
    location /grafana/ {
        proxy_pass http://grafana-dev:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===================================
    # Health Check
    # ===================================
    location /health {
        access_log off;
        return 200 "healthy dev\n";
        add_header Content-Type text/plain;
    }

    # ===================================
    # Security & Robots
    # ===================================
    location /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
